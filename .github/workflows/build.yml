name: Publish update manifest

on:
  push:
    branches:
      - main
    paths:
      - mygo.json

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: check
        shell: pwsh
        run: |
          $current = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          $before = "${{ github.event.before }}"
          $changed = $false
          if ($before -and $before -notmatch '^0+$') {
            $oldText = git show "${before}:mygo.json" 2>$null | Out-String
            if ($LASTEXITCODE -eq 0 -and $oldText) {
              $oldVersion = ($oldText | ConvertFrom-Json).version
              $changed = ($oldVersion -ne $current)
            }
          }
          "version=$current" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "changed=$($changed.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "version=$current changed=$changed"

  build:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true

      - name: Build signed app
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform windows/amd64

      - name: Upload update manifest to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ needs.detect.outputs.version }}" build/windows-amd64/update-windows-amd64.json --clobber
