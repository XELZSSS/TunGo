name: Publish update manifest

on:
  push:
    branches:
      - main
    paths:
      - mygo.json

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    if: github.event.forced != true
    outputs:
      version: ${{ steps.check.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: check
        shell: pwsh
        run: |
          $current = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          $before = "${{ github.event.before }}"
          $changed = $false
          $reachable = $false
          if ($before -and $before -notmatch '^0+$') {
            git cat-file -e "${before}^{commit}" 2>$null
            $reachable = ($LASTEXITCODE -eq 0)
          }
          if ($reachable) {
            $oldText = git show "${before}:mygo.json" 2>$null | Out-String
            if ($oldText) {
              $oldVersion = ($oldText | ConvertFrom-Json).version
              $changed = ($oldVersion -ne $current)
            }
          }
          "version=$current" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "changed=$($changed.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "version=$current changed=$changed"
          exit 0

  build:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true

      - name: Build signed app
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform windows/amd64

      - name: Create draft release with manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --target "${{ github.sha }}" `
              --title $tag `
              --notes "" `
              --draft `
              build/windows-amd64/update-windows-amd64.json
          } else {
            gh release upload $tag build/windows-amd64/update-windows-amd64.json --clobber
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
